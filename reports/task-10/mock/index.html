<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dota2 战绩查询</title>
<style>
:root {
  --bg: #0f1216; --panel: #171b21; --panel-2: #1e232b; --line: #2a303a;
  --text: #e6e9ee; --muted: #8b93a1; --accent: #e0a63a;
  --win: #4cc38a; --lose: #e5595b; --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

/* 顶栏：查询 */
header { position: sticky; top: 0; z-index: 10; background: rgba(15,18,22,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; gap: 12px; align-items: center; height: 56px; }
.logo { font-weight: 700; white-space: nowrap; }
.logo b { color: var(--accent); }
form.search { flex: 1; display: flex; gap: 8px; min-width: 0; }
.input { flex: 1; min-width: 0; height: 36px; padding: 0 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; outline: none; }
.input:focus { border-color: var(--accent); }
.btn { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1405; font-weight: 600; }
.btn:hover { filter: brightness(1.1); }

.banner { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px; background: #2a2414; color: #d9c08a; font-size: 12px; }

/* 玩家卡片 */
.player { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; margin: 16px 0; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.avatar { width: 64px; height: 64px; border-radius: 12px; background: linear-gradient(135deg, #3a4150, #232833); display: grid; place-items: center; font-size: 26px; font-weight: 700; color: var(--accent); }
.player h1 { margin: 0; font-size: 20px; }
.player .sub { color: var(--muted); font-size: 13px; }
.rank { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; background: #2b2a1d; color: var(--accent); font-size: 12px; }
.stats { display: flex; gap: 20px; text-align: right; }
.stat .v { font-size: 20px; font-weight: 700; }
.stat .k { color: var(--muted); font-size: 12px; }
.win { color: var(--win); } .lose { color: var(--lose); }

/* 标签栏 */
nav.tabs { position: sticky; top: 56px; z-index: 9; display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
nav.tabs button { flex: 1; height: 36px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }

section.panel { margin: 12px 0 40px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.chip { height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.toolbar .spacer { flex: 1; }
.toolbar .note { color: var(--muted); font-size: 12px; }

.list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.head { color: var(--muted); font-size: 12px; background: var(--panel-2); }
.row.head button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
.row.head button[data-active] { color: var(--accent); }

/* 比赛行 */
.m-row { grid-template-columns: 4px 1.6fr .7fr 1fr .8fr .9fr; padding-left: 0; }
.m-row .bar { align-self: stretch; border-radius: 0 3px 3px 0; }
.m-row.w .bar { background: var(--win); } .m-row.l .bar { background: var(--lose); }
.hero { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hero img, .hero .ph { flex: none; width: 32px; height: 32px; border-radius: 6px; background: var(--panel-2); object-fit: cover; }
.hero .ph { display: grid; place-items: center; font-size: 14px; color: var(--accent); }
.hero .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero .n small { display: block; color: var(--muted); font-size: 11px; }
.res { font-weight: 600; }
.kda b { font-weight: 600; }
.muted { color: var(--muted); font-size: 12px; }
.more { display: block; width: 100%; margin-top: 10px; }

/* 英雄统计 */
.h-row { grid-template-columns: 1.6fr .6fr 1.4fr .8fr .8fr; }
.wr { display: flex; align-items: center; gap: 8px; }
.wr .track { flex: 1; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.wr .fill { height: 100%; background: var(--win); }
.wr .fill.low { background: var(--lose); }
.wr span { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

/* 队友 */
.p-row { grid-template-columns: 1.6fr .7fr 1.4fr .7fr auto; }
.p-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 对比 */
.cmp { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.cmp > div { padding: 10px 14px; border-top: 1px solid var(--line); }
.cmp .lbl { color: var(--muted); text-align: center; font-size: 12px; align-self: center; }
.cmp .a { text-align: right; } .cmp .better { color: var(--accent); font-weight: 700; }
.cmp .top { border-top: 0; font-weight: 700; }
.cmp .heroes { display: flex; gap: 6px; flex-wrap: wrap; }
.cmp .a .heroes { justify-content: flex-end; }

.empty, .error { padding: 32px 16px; text-align: center; color: var(--muted); }
.error { color: var(--lose); }
.skel { height: 52px; margin: 8px 0; border-radius: 8px; background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 16px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }

/* 手机：≤640px */
@media (max-width: 640px) {
  .logo span { display: none; }
  .player { grid-template-columns: 48px 1fr; gap: 12px; }
  .avatar { width: 48px; height: 48px; font-size: 20px; }
  .stats { grid-column: 1 / -1; justify-content: space-between; gap: 8px; text-align: left; }
  .stat .v { font-size: 16px; white-space: nowrap; }
  nav.tabs button { font-size: 13px; padding: 0 2px; }
  .row.head { display: none; }
  .m-row { grid-template-columns: 4px 1fr auto; row-gap: 2px; }
  .m-row .hero { grid-column: 2; grid-row: 1 / span 2; }
  .m-row .res { grid-column: 3; grid-row: 1; text-align: right; }
  .m-row .kda { grid-column: 3; grid-row: 2; text-align: right; }
  .m-row .bar { grid-row: 1 / span 2; }
  .m-row .dur, .m-row .when { display: none; }
  .m-row .hero small .mob { display: inline; }
  .h-row { grid-template-columns: 1fr 1fr; row-gap: 4px; }
  .h-row .wr { grid-column: 1 / -1; grid-row: 2; }
  .h-row .c-n, .h-row .c-kda { display: none; }
  .h-row .c-g { text-align: right; }
  .p-row { grid-template-columns: 1fr auto; row-gap: 4px; }
  .p-row .wr { grid-column: 1 / -1; }
  .p-row .c-ag { display: none; }
  .p-row .c-g { text-align: right; }
  .p-row .c-act { grid-column: 1 / -1; }
  .p-row .c-act .btn { width: 100%; height: 32px; }
  .cmp > div { padding: 8px 10px; }
}
.mob { display: none; }
</style>
</head>

<header>
  <div class="wrap">

    <button role="tab" data-tab="compare">对比</button>

</main>

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
function pct(w, n) { return n ? (w / n * 100) : 0; }

function heroCell(id, sub) {
  var h = HERO[id] || { key: "", en: "Unknown", zh: "未知英雄" };
  // 固定宽高防止布局抖动；loading=lazy 只加载进入视口的图标；decoding=async 不阻塞主线程
  return '<div class="hero"><img src="' + ICON + h.key + '.png" width="32" height="32" loading="lazy" decoding="async" alt="" data-zh="' + esc(h.zh.charAt(0)) + '">' +
    '<div class="n">' + esc(h.zh) + '<small>' + (sub || esc(h.en)) + '</small></div></div>';
}
function toast(msg) { var t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("on"); }, 2200); }

// 图片失败 → 中文首字占位（捕获阶段监听，一个监听器覆盖全部图片）
document.addEventListener("error", function (e) {
  var img = e.target;
  if (img.tagName !== "IMG" || !img.dataset.zh) return;
  var ph = document.createElement("span"); ph.className = "ph"; ph.textContent = img.dataset.zh;
  img.replaceWith(ph);
}, true);

// 模拟请求：真实实现里对应一次 /api/player/{id}/summary 聚合请求
function fetchPlayer(id) {
  return new Promise(function (res, rej) {
    setTimeout(function () { SAMPLE[id] ? res(SAMPLE[id]) : rej(new Error("mock 中没有该账号的样例数据（可试 139369436 或 143730410）")); }, 350);
  });
}

function load(id) {
  id = String(id).trim();
  if (!/^\d{1,12}$/.test(id)) { toast("请输入纯数字的 Account ID"); return; }
  state.id = id; state.data = null; state.shown = PAGE;
  $("#q").value = id;
  $("#player").innerHTML = '<div class="skel" style="height:96px"></div>';
  $("#panel").innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  syncHash();
  fetchPlayer(id).then(function (d) {
    if (state.id !== id) return; // 用户已切换到别的 ID，丢弃过期结果
    state.data = d; renderPlayer(); renderPanel();
  }, function (err) {
    $("#player").innerHTML = ""; $("#panel").innerHTML = '<div class="error">' + esc(err.message) + '</div>';
  });
}

function renderPlayer() {
  var d = state.data, p = d.profile.profile, n = d.wl.win + d.wl.lose;
  var recent = d.matches.slice(0, 20), rw = recent.filter(isWin).length;
  $("#player").innerHTML =
    '<div class="player"><div class="avatar">' + esc(p.personaname.charAt(0)) + '</div>' +
    '<div><h1>' + esc(p.personaname) + '</h1><div class="sub">ID ' + esc(state.id) + '</div><span class="rank">' + rankName(d.profile.rank_tier) + '</span></div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="v">' + n.toLocaleString() + '</div><div class="k">总场次</div></div>' +
      '<div class="stat"><div class="v"><span class="win">' + d.wl.win + '</span> / <span class="lose">' + d.wl.lose + '</span></div><div class="k">胜 / 负</div></div>' +
      '<div class="stat"><div class="v">' + pct(d.wl.win, n).toFixed(1) + '%</div><div class="k">总胜率</div></div>' +
      '<div class="stat"><div class="v ' + (rw >= 10 ? "win" : "lose") + '">' + rw + '-' + (20 - rw) + '</div><div class="k">近 20 场</div></div>' +
    '</div></div>';
}

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === tab); });
  syncHash();
  if (state.data) renderPanel();
}

function renderPanel() {
  var f = { matches: renderMatches, heroes: renderHeroes, peers: renderPeers, compare: renderCompare }[state.tab];
  f();
}

function renderMatches() {
  var all = state.data.matches;
  var list = all.filter(function (m) { return state.filter === "all" || (state.filter === "w") === isWin(m); });
  var rows = list.slice(0, state.shown).map(function (m) {
    var w = isWin(m), mode = MODES[m.game_mode] || "其他模式";
    return '<div class="row m-row ' + (w ? "w" : "l") + '"><div class="bar"></div>' +
      heroCell(m.hero_id, '<span class="mob">' + ago(m.start_time) + ' · ' + dur(m.duration) + ' · </span>' + mode) +
      '<div class="res ' + (w ? "win" : "lose") + '">' + (w ? "胜利" : "失败") + '</div>' +
      '<div class="kda"><b>' + m.kills + '</b> / <b class="lose">' + m.deaths + '</b> / <b>' + m.assists + '</b></div>' +
      '<div class="dur muted">' + dur(m.duration) + '</div>' +
      '<div class="when muted">' + ago(m.start_time) + '</div></div>';
  }).join("");
  $("#panel").innerHTML =
    '<div class="toolbar">' + chip("all", "全部") + chip("w", "胜利") + chip("l", "失败") +
    '<span class="spacer"></span><span class="note">最近 ' + all.length + ' 场</span></div>' +
    '<div class="list"><div class="row head m-row"><div></div><div>英雄 / 模式</div><div>结果</div><div>击杀 / 死亡 / 助攻</div><div>时长</div><div>时间</div></div>' +
    (rows || '<div class="empty">没有符合条件的比赛</div>') + '</div>' +
    (list.length > state.shown ? '<button class="btn more" id="more">加载更多（还有 ' + (list.length - state.shown) + ' 场）</button>' : "");
  function chip(v, t) { return '<button class="chip" data-filter="' + v + '" aria-pressed="' + (state.filter === v) + '">' + t + '</button>'; }
}

function heroStats(matches) {
  var by = {};
  matches.forEach(function (m) {
    var s = by[m.hero_id] || (by[m.hero_id] = { id: m.hero_id, games: 0, win: 0, k: 0, d: 0, a: 0 });
    s.games++; if (isWin(m)) s.win++; s.k += m.kills; s.d += m.deaths; s.a += m.assists;
  });
  return Object.keys(by).map(function (k) {
    var s = by[k]; s.wr = pct(s.win, s.games); s.kda = (s.k + s.a) / Math.max(1, s.d); return s;
  });
}

function renderHeroes() {
  var q = state.heroQ.trim().toLowerCase();
  var list = heroStats(state.data.matches).filter(function (s) {
    var h = HERO[s.id]; return !q || (h && (h.zh.indexOf(q) >= 0 || h.en.toLowerCase().indexOf(q) >= 0));
  });
  var key = state.heroSort;
  list.sort(function (a, b) { return b[key] - a[key] || b.games - a.games; });
  var rows = list.map(function (s) {
    return '<div class="row h-row">' + heroCell(s.id) +
      '<div class="c-g">' + s.games + ' 场</div>' +
      '<div class="wr"><div class="track"><div class="fill' + (s.wr < 50 ? " low" : "") + '" style="width:' + s.wr + '%"></div></div><span>' + s.wr.toFixed(0) + '%</span></div>' +
      '<div class="c-kda">' + s.kda.toFixed(2) + '</div>' +
      '<div class="c-n muted">' + (s.k / s.games).toFixed(1) + '/' + (s.d / s.games).toFixed(1) + '/' + (s.a / s.games).toFixed(1) + '</div></div>';
  }).join("");
  $("#panel").innerHTML =
    '<div class="toolbar"><input class="input" id="hq" placeholder="搜索英雄（中文或英文）" value="' + esc(state.heroQ) + '" style="max-width:240px">' +
    '<select class="input" id="hs" style="flex:none;width:auto">' +
      opt("games", "按场次") + opt("wr", "按胜率") + opt("kda", "按 KDA") + '</select>' +
    '<span class="spacer"></span><span class="note">基于最近 ' + state.data.matches.length + ' 场</span></div>' +
    '<div class="list"><div class="row head h-row"><div>英雄</div><div>场次</div><div>胜率</div><div>KDA</div><div>场均 K/D/A</div></div>' +
    (rows || '<div class="empty">没有匹配的英雄</div>') + '</div>';
  function opt(v, t) { return '<option value="' + v + '"' + (key === v ? " selected" : "") + '>' + t + '</option>'; }
}

function renderPeers() {
  var peers = state.data.peers.slice().sort(function (a, b) { return b.with_games - a.with_games; });
  var rows = peers.map(function (p) {
    var wr = pct(p.with_win, p.with_games);
    return '<div class="row p-row"><div class="p-name">' + esc(p.personaname) + '<div class="muted">ID ' + p.account_id + '</div></div>' +
      '<div class="c-g">同队 ' + p.with_games + ' 场</div>' +
      '<div class="wr"><div class="track"><div class="fill' + (wr < 50 ? " low" : "") + '" style="width:' + wr + '%"></div></div><span>' + wr.toFixed(0) + '%</span></div>' +
      '<div class="c-ag muted">对抗 ' + p.against_games + ' 场</div>' +
      '<div class="c-act"><button class="btn" data-cmp="' + p.account_id + '">对比</button></div></div>';
  }).join("");
  $("#panel").innerHTML =
    '<div class="toolbar"><span class="note">按同队场次排序；胜率为同队胜率</span></div>' +
    '<div class="list"><div class="row head p-row"><div>队友</div><div>同队场次</div><div>同队胜率</div><div>对抗</div><div></div></div>' +
    (rows || '<div class="empty">暂无队友数据</div>') + '</div>';
}

function summary(d) {
  var ms = d.matches.slice(0, 50), n = d.wl.win + d.wl.lose, w = ms.filter(isWin).length, k = 0, de = 0, a = 0, t = 0;
  ms.forEach(function (m) { k += m.kills; de += m.deaths; a += m.assists; t += m.duration; });
  var top = heroStats(ms).sort(function (x, y) { return y.games - x.games; }).slice(0, 3);
  return { name: d.profile.profile.personaname, rank: rankName(d.profile.rank_tier), rt: d.profile.rank_tier || 0, n: n, wr: pct(d.wl.win, n), rwr: pct(w, ms.length), kda: (k + a) / Math.max(1, de), dur: t / Math.max(1, ms.length), top: top };
}

function renderCompare() {
  var html = '<form class="toolbar" id="cmpf"><input class="input" id="cq" inputmode="numeric" placeholder="对比对象的 Account ID" value="' + esc(state.cmpId) + '" style="max-width:260px"><button class="btn primary">对比</button><span class="note">也可在「队友」页点「对比」</span></form><div id="cmpout"></div>';
  $("#panel").innerHTML = html;
  if (state.cmpId) runCompare();
  else $("#cmpout").innerHTML = '<div class="empty">输入另一位玩家的 ID 开始对比（样例：143730410）</div>';
}

function runCompare() {
  var id = state.cmpId, out = $("#cmpout");
  out.innerHTML = '<div class="skel"></div><div class="skel"></div>';
  // 真实实现：A 方数据直接复用已加载的 summary，只为 B 发 1 个请求
  fetchPlayer(id).then(function (bd) {
    if (state.tab !== "compare" || state.cmpId !== id) return;
    var A = summary(state.data), B = summary(bd);
    function line(lbl, a, b, fmt, higher) {
      var ca = "", cb = "";
      if (higher !== null && a !== b) { if ((a > b) === higher) ca = " better"; else cb = " better"; }
      return '<div class="a' + ca + '">' + fmt(a) + '</div><div class="lbl">' + lbl + '</div><div class="b' + cb + '">' + fmt(b) + '</div>';
    }
    function tops(s) { return '<div class="heroes">' + s.top.map(function (h) { return heroCell(h.id, h.games + " 场"); }).join("") + '</div>'; }
    out.innerHTML = '<div class="cmp">' +
      '<div class="a top">' + esc(A.name) + '</div><div class="lbl top">VS</div><div class="b top">' + esc(B.name) + '</div>' +
      line("段位", A.rt, B.rt, function (v) { return rankName(v); }, true) +
      line("总场次", A.n, B.n, function (v) { return v.toLocaleString(); }, null) +
      line("总胜率", A.wr, B.wr, function (v) { return v.toFixed(1) + "%"; }, true) +
      line("近 50 场胜率", A.rwr, B.rwr, function (v) { return v.toFixed(0) + "%"; }, true) +
      line("近 50 场 KDA", A.kda, B.kda, function (v) { return v.toFixed(2); }, true) +
      line("平均时长", A.dur, B.dur, function (v) { return dur(Math.round(v)); }, null) +
      '<div class="a">' + tops(A) + '</div><div class="lbl">常用英雄</div><div class="b">' + tops(B) + '</div>' +
      '</div>';
  }, function (err) { out.innerHTML = '<div class="error">' + esc(err.message) + '</div>'; });
}

// 事件委托：面板重绘时无需重复绑定
$("#panel").addEventListener("click", function (e) {
  var t = e.target.closest("button"); if (!t) return;
  if (t.dataset.filter) { state.filter = t.dataset.filter; state.shown = PAGE; renderMatches(); }
  else if (t.id === "more") { state.shown += PAGE; renderMatches(); }
});
$("#panel").addEventListener("input", function (e) {
  if (e.target.id === "hq") {
    state.heroQ = e.target.value; var pos = e.target.selectionStart;
    renderHeroes(); var el = $("#hq"); el.focus(); el.setSelectionRange(pos, pos);
  }
});
$("#panel").addEventListener("change", function (e) { if (e.target.id === "hs") { state.heroSort = e.target.value; renderHeroes(); } });
$("#panel").addEventListener("submit", function (e) {
  if (e.target.id !== "cmpf") return;
  e.preventDefault(); state.cmpId = $("#cq").value.trim(); if (state.cmpId) runCompare();
});
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-cmp]"); if (!t) return;
  state.cmpId = t.dataset.cmp; setTab("compare");
});
$("#tabs").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) setTab(b.dataset.tab); });
$("#search").addEventListener("submit", function (e) { e.preventDefault(); load($("#q").value); });
$("#refresh").addEventListener("click", function () {
  if (!state.id) return;
  // 真实实现：POST /api/od/players/{id}/refresh，并清掉该玩家的服务端缓存
  toast("已请求 OpenDota 重新解析，约 1–2 分钟后再刷新可见新比赛");
});

// 地址栏同步：#/139369436/heroes，可收藏、可分享、刷新不丢状态
function syncHash() { if (state.id) history.replaceState(null, "", "#/" + state.id + "/" + state.tab); }
(function init() {
  var m = location.hash.match(/^#\/(\d+)(?:\/(\w+))?/);
  var tab = m && m[2] && /^(matches|heroes|peers|compare)$/.test(m[2]) ? m[2] : "matches";
  setTab(tab);
  load(m ? m[1] : "139369436");
})();
</script>
</body>
</html>
