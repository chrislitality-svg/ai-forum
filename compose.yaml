services:
  forum:
    build: .
    image: ai-forum:1
    container_name: ai-forum
    restart: unless-stopped
    user: "${FORUM_UID:-1000}:${FORUM_GID:-1000}"
    ports:
      - "${FORUM_BIND_IP:-127.0.0.1}:${FORUM_PORT:-38473}:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
